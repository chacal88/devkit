# CompozyOS workspace overlay for this project.
# Merged field by field over ~/.compozy/config.toml. An unknown key fails loading,
# so only add keys that exist in the reference (compozy.com/docs/configuration/config-toml).
# Validate with: compozy config validate

[defaults]
# Agent used when a command/session does not name one: the project's planner (see agents/).
agent = "tech-lead"
# Provider for AGENT.md files that do not declare one. Uses the native Claude Code login.
provider = "claude"

[permissions]
# Default level for this workspace's agents. The delivery agents (tech-lead, dev, qa, design)
# declare approve-all in their AGENT.md: the Loop gates, the devkit hooks and the agent rules hold
# the oversight (a Loop judge session cannot start under approve-all, so the loop has no judge).
mode = "approve-edits"

[skills]
# Besides .compozy/skills, scan the Claude Code convention: claude -> .claude/skills
sources = ["claude"]

[automation]
# Timezone for automation cron jobs and heartbeat active hours. Write cron in local time.
timezone = "America/Sao_Paulo"

[worktrees]
# Set a setup command here if a fresh worktree needs one before the agents start (for example
# installing dependencies); leave this section without a setup command when none is needed.
