name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Catalog is up to date
        run: python3 scripts/gen-catalog.py --check
      - name: CompozyOS agents are up to date
        run: node plugins/compozy/skills/compozy-setup/scripts/gen-agents.mjs --check
      - name: Names, descriptions, links, language
        run: python3 scripts/check.py
      - name: Install OpenSpec (the hook tests and the schema step need it)
        run: npm i -g @fission-ai/openspec@2.0.0
      - name: Hook tests
        env:
          TMPDIR: ${{ runner.temp }}/hook-tests-tmp
        run: |
          mkdir "$TMPDIR"
          git config --global user.email ci@example.com
          git config --global user.name ci
          node --test plugins/openspec/hooks/guard.test.mjs
      - name: Hook tests left nothing in TMPDIR
        env:
          HOOK_TMP: ${{ runner.temp }}/hook-tests-tmp
        run: |
          left="$(ls -A "$HOOK_TMP")"
          if [ -n "$left" ]; then printf 'left in %s:\n%s\n' "$HOOK_TMP" "$left"; exit 1; fi
      - name: Schemas validate against the OpenSpec CLI
        run: |
          tmp="$(mktemp -d)" && cd "$tmp" && git init -q
          openspec init --tools none --no-animation . >/dev/null
          bash "$GITHUB_WORKSPACE/plugins/openspec/skills/openspec-setup/scripts/install-schemas.sh" .
          openspec schema validate devkit
          openspec schema validate devkit-lite
