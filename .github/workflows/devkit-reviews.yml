name: devkit-reviews
on:
  pull_request:
permissions:
  contents: read
jobs:
  devkit-reviews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node plugins/openspec/hooks/deliver-check.mjs --ci
