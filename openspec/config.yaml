# Default flow: devkit-lite (requirements grill → proposal → optional spec delta →
# tasks → apply → evidence + reviews). Use the full flow, which adds an
# independent readiness gate, the owner's plan approval and code written only
# by tdd-implementer, for changes that are new capabilities, cross areas,
# change a public contract or data model, touch auth/money/personal data, or
# are hard to roll back:
#   openspec new change <name> --schema devkit
schema: devkit-lite

# How far ship-change takes an approved change, per schema (plan | pr | merge).
# merge: GitHub's auto-merge, enabled only when deliver-check reports 8/8 (ADR 0002); the archive PR that follows a merge is auto-merged too (ADR 0003).
ship:
  devkit-lite: merge
  devkit: merge
  devkit-project: merge
merge_method: squash

# The settings of /devkit change: the language of the project's files, and who runs a change (claude | compozy | script).
# An optional token budget (budget: a whole number) stops a run between hand-offs; a change's own .openspec.yaml can override it. None is set here.
# An optional models: table (a stage id, then opus, sonnet, haiku, or opus[1m] and sonnet[1m]) picks the model of single stages over the built-in default; a change's own .openspec.yaml can override a stage. None is set here.
devkit:
  language: en
  driver: claude
  # The file whose top-level "version" the loop tags (v<version>) on a merge that bumped it (ADR 0019).
  release_tag: plugins/openspec/.claude-plugin/plugin.json

# Shown to the agent in every artifact and in apply. Fill in for this project.
context: |
  Stack: Claude Code plugin marketplace - Markdown agents/skills, OpenSpec schemas (YAML), Node.js hooks (plugins/openspec/hooks/guard.mjs), Python scripts
  Test command: node scripts/test-suite.mjs && python3 scripts/check.py
  Lint / typecheck: claude plugin validate . ; python3 scripts/gen-catalog.py must leave no diff
  ADRs: docs/adr/ (0001 coordination without a harness, superseded by 0010; 0002 merge without the owner by opt-in; 0003 auto-merge the archive PR; 0004 devkit per project; 0005 parallel steps and a session wake-up, superseded by 0006; 0006 phases as child sessions, amended by 0007; 0007 one change on request, superseded by 0010; 0008 reviews as a workflow; 0009 the CompozyOS loop as a second driver; 0010 OpenSpec as the harness with a roadmap coordinator and a change coordinator, supersedes 0001 and 0007; 0011 the change coordinator is the owner's session, held by hooks, amends 0010; 0012 the devkit-reviews check follows the change's script, amends 0002, 0003 and 0004; 0013 the roadmap coordinator is the owner's session, its stages in the background, amends 0010 and 0011; 0014 in the desktop app each change of a roadmap run runs in a session of its own, amends 0011 and 0013; 0015 a project slice is a change on devkit-project delivered in one pull request, amends 0012; 0016 stage roles write their own files, amends 0010 and 0011; 0017 a change's state is derived in one place and a stopped change's title shows it, amends 0014; 0018 the delivery model chosen per project and the test-branch lock, amends 0002, 0003, 0010 and 0012; 0019 the delivery loop tags the release it merged, when the project names its release file; 0020 a change can run on another machine, claimed on GitHub when it opens, amends 0013, 0014 and 0017; 0021 a roadmap run opens every change at its start, runs change sessions on the run's ticket and keeps one periodic check, amends 0004, 0006, 0010, 0011, 0013, 0014, 0017 and 0020; 0022 reviewed changes leave on a delivery train, amends 0002, 0003, 0012 and 0018; 0023 the model chosen by stage, sessions only step down and never below the stages they still run, a failed stage retried once a model up, amends 0014; 0024 CompozyOS runs the short loop, amends 0008, 0009 and 0016; 0025 a merge of the base stales the evidence and reviews only when it brings the change's own files, amends 0002; 0026 the devkit test suite runs by file in parallel, each file in its own temporary folder)
  Default branch: main
  Parsers: A plan that moves or writes a parser decides what unterminated input does (an unclosed fence, a missing closing line, an empty file); the readiness review asks for it.
  Existing tests: A plan that changes a message, a schema key or a doc string greps the test files for it, and every test that asserts it is a row of the plan's test table; the readiness review asks for the grep.
  Test history: A test never reads the repository's git history (CI checks out at depth 1); old content is held as a fixture or a constant.
  Conventions: conventional commits; docs and assets in English; bump the version of each changed pack in plugin.json and marketplace.json, plus a CHANGELOG line

rules:
  requirements:
    - Ask the owner every question that nothing written settles; the requirements-triage agent answers the others first, each with its source. Never answer a question yourself. The triage answers first only in the grill of a change that follows flow version 2 or later of its script; in a change on flow 1 the owner answers every question.
  proposal:
    - Keep it under two pages; the how belongs in design.md
    - Every sentence stating a fact about the repository is true at the commit that ships it; a task that corrects such a claim names every file that repeats it
  design:
    - Record any decision that changes an ADR as a proposal for a new ADR, not as a silent deviation
    - A sentence saying a test pins a behaviour names that test file
    - "Read the ADRs' rejected alternatives: an approach an ADR rejected needs its own ADR before readiness, never a line concluding none is needed"
  tasks:
    - One "## N." group per phase, each ending with a gate task that names the test command
    - Every acceptance criterion id appears in at least one task
    - A task that writes an ADR or bumps a version names "the next free number on origin/main at the last merge before review", never a literal number or version
    - A task that changes a text a test pins (a skill's frontmatter, a reply, a doc sentence) names each test file that asserts the old text; grep the test files for it
  readiness:
    - Written only by the plan-readiness-reviewer agent, never by the plan's author

operations:
  apply:
    guidance:
      - One phase at a time, each dispatched to the devkit-core:tdd-implementer agent; stop at the phase gate
      - After the last phase, dispatch devkit-core:pr-verifier (writes evidence.md; a defect is fixed and the evidence recorded again), then run review-change for this change (each reviewer writes reviews/<reviewer>.md)
      - Open the PR with the commit-and-pr agent; the merge is the owner's in `plan` and `pr` mode, GitHub's in `merge` mode (ship-change enables auto-merge)
  archive:
    guidance:
      - In `pr` and `merge` ship modes `ship-change` runs the archive steps after the merge (retro, the owner's answer per proposal, `openspec archive`, roadmap tick, approved proposals, archive PR on `chore/archive-<id>`)
      - Run the retro skill and propose doc or rule updates to the owner before archiving
      - If openspec/roadmap.md lists the change, tick its line after archiving
